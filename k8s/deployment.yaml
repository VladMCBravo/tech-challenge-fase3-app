apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-backend
  labels:
    app: oficina-backend
    tags.datadoghq.com/service: "oficina-mecanica-api"
    tags.datadoghq.com/env: "production"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-backend
  template:
    metadata:
      labels:
        app: oficina-backend
        tags.datadoghq.com/service: "oficina-mecanica-api"
        tags.datadoghq.com/env: "production"
      annotations:
        # Coleta de logs do container pelo Datadog Agent (logs estruturados JSON)
        ad.datadoghq.com/api.logs: '[{"source":"nodejs","service":"oficina-mecanica-api"}]'
    spec:
      initContainers:
        - name: migrate
          image: 538889416411.dkr.ecr.us-east-1.amazonaws.com/oficina-backend:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - 'echo "Rodando migrations..." && npx prisma migrate deploy --schema prisma/schema.prisma'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: DATABASE_URL
      containers:
        - name: api
          image: 538889416411.dkr.ecr.us-east-1.amazonaws.com/oficina-backend:latest
          imagePullPolicy: Always
          command: ['node', 'dist/src/main.js']
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: oficina-secrets
          env:
            # Datadog: aponta o dd-trace (APM + DogStatsD) para o Agent no mesmo nó
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "oficina-mecanica-api"
            - name: DD_VERSION
              value: "1.0.0"
          # Healthchecks HTTP reais (liveness = app viva; readiness = app + banco)
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
