# Datadog Agent (DaemonSet) — coleta métricas do cluster (CPU/memória),
# recebe traces (APM) e métricas customizadas (DogStatsD) da aplicação, e coleta logs.
#
# PRÉ-REQUISITO: crie o secret com a sua API key do Datadog (uma vez):
#   kubectl create secret generic datadog-secret \
#     --from-literal api-key=<SUA_DD_API_KEY>
#
# Ajuste DD_SITE conforme sua conta: "datadoghq.com" (US) ou "datadoghq.eu" (EU).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
rules:
  - apiGroups: [""]
    resources: ["services", "events", "endpoints", "pods", "nodes", "componentstatuses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/spec", "nodes/proxy", "nodes/stats"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent
subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  labels:
    app: datadog-agent
spec:
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
    spec:
      serviceAccountName: datadog-agent
      containers:
        - name: datadog-agent
          image: gcr.io/datadoghq/agent:7
          ports:
            - containerPort: 8125
              name: dogstatsdport
              protocol: UDP
              hostPort: 8125
            - containerPort: 8126
              name: traceport
              protocol: TCP
              hostPort: 8126
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_SITE
              value: "datadoghq.com"
            - name: DD_CLUSTER_NAME
              value: "oficina-eks-cluster-v2"
            - name: DD_KUBERNETES_KUBELET_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_KUBELET_TLS_VERIFY
              value: "false"
            # APM (traces)
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
            # DogStatsD (métricas customizadas: oficina.*)
            - name: DD_DOGSTATSD_NON_LOCAL_TRAFFIC
              value: "true"
            # Logs
            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          volumeMounts:
            - name: procdir
              mountPath: /host/proc
              readOnly: true
            - name: cgroups
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: pointerdir
              mountPath: /opt/datadog-agent/run
            - name: logpodpath
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: procdir
          hostPath:
            path: /proc
        - name: cgroups
          hostPath:
            path: /sys/fs/cgroup
        - name: pointerdir
          hostPath:
            path: /opt/datadog-agent/run
        - name: logpodpath
          hostPath:
            path: /var/log/pods
