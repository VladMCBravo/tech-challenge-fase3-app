name: CI/CD - Infraestrutura (Terraform)

on:
  push:
    branches:
      - main # Executa o Apply quando há um merge na main
  pull_request:
    branches:
      - main # Executa apenas o Plan quando é aberto um PR

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout do código
        uses: actions/checkout@v3

      # 2. Configura as credenciais da AWS (Atenção ao Session Token do AWS Academy)
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 3. Instala o Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # 4. Inicializa o Terraform (conecta no state remoto do S3 - ver backend.tf)
      - name: Terraform Init
        run: terraform init

      # 5. Importa para o state os recursos que já existem na AWS (idempotente).
      #    O "|| true" ignora quando o recurso já está no state (execucoes seguintes).
      #    Traz o cluster EKS e o node group para o state remoto, evitando o erro
      #    "already exists" nesses recursos.
      #
      #    OBS IMPORTANTE: a VPC deste repo e criada pelo modulo terraform-aws-modules/vpc.
      #    Quando a infra JA existe, adotar o state remoto exige um bootstrap unico e
      #    supervisionado (import do modulo VPC + revisao do plan) com o lab aberto —
      #    ver README-infra-k8s e ADR-004.
      - name: Importar recursos existentes
        run: |
          terraform import aws_eks_cluster.oficina_cluster oficina-eks-cluster-v2 || true
          terraform import aws_eks_node_group.oficina_nodes oficina-eks-cluster-v2:oficina-node-group || true

      # 6. Verifica formatação (boa prática, não bloqueia)
      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      # 7. Planeamento (corre em PR e em Push)
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan

      # 8. Aplica a infraestrutura (SOMENTE no push para a main)
      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
